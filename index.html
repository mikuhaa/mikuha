<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0869c2"><meta name="description" content="MIKUHA — пошаговая инструкция по снятию и установке клавиши ноутбука."><title>MIKUHA — замена клавиши ноутбука</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#142b46;background:#f1f6fc}*{box-sizing:border-box}body{margin:0}header{background:#0869c2;color:#fff;padding:18px 20px;text-align:center}header .brand{font-weight:850;letter-spacing:.18em;font-size:21px}header small{display:block;margin-top:5px;opacity:.9;font-size:12px}main{max-width:660px;margin:auto;padding:20px 15px 35px}.intro{text-align:center;margin:0 0 18px}h1{font-size:clamp(23px,5vw,30px);line-height:1.2;margin:0 0 10px}.intro p{color:#52657a;font-size:14px;line-height:1.5;margin:0}.panel{background:#fff;border:1px solid #d9e5f3;border-radius:18px;overflow:hidden;box-shadow:0 10px 28px #12385b10}.meta{display:flex;align-items:center;justify-content:space-between;padding:17px 17px 10px;font-size:14px;font-weight:700}.meta .section{color:#0869c2}.progress{height:6px;background:#e6eef8;margin:0 17px 15px;border-radius:20px;overflow:hidden}.progress>div{height:100%;width:12.5%;background:#0869c2;transition:width .25s}.photo{display:block;width:100%;height:auto;cursor:zoom-in}.photo:focus-visible{outline:3px solid #0869c2;outline-offset:-3px}.hint{font-size:12px;text-align:center;color:#63748a;padding:8px 10px 0}.controls{display:flex;gap:10px;padding:16px}.controls button,.reset{border:0;border-radius:12px;padding:14px 16px;font-size:15px;font-weight:750;cursor:pointer;min-height:48px}.controls button{flex:1}.prev{background:#e8f0fa;color:#13538b}.next{background:#0869c2;color:#fff}.controls button:disabled{opacity:.35;cursor:not-allowed}.dots{display:flex;gap:6px;justify-content:center;padding:0 10px 19px}.dots button{width:24px;height:24px;border:0;background:transparent;cursor:pointer;padding:7px}.dots button:before{content:"";display:block;width:10px;height:10px;border-radius:50%;background:#c5d5e7}.dots button[aria-current="step"]:before{background:#0869c2}.foot{text-align:center;margin:20px 0;color:#617389;font-size:13px}.reset{background:transparent;border:1px solid #b8cde4;color:#145f9c;margin-top:10px}.overlay{position:fixed;inset:0;background:#07111df2;display:none;z-index:10;align-items:center;justify-content:center;padding:60px 10px 25px}.overlay.open{display:flex}.overlay img{max-width:100%;max-height:100%;object-fit:contain}.close{position:absolute;right:14px;top:14px;background:#fff;color:#172b43;border:0;border-radius:50%;width:42px;height:42px;font-size:26px;cursor:pointer}@media(min-width:650px){main{padding-top:32px}.photo{width:100%}}@media(prefers-reduced-motion:reduce){.progress>div{transition:none}}
</style></head><body>
<header><div class="brand">MIKUHA</div><small>Инструкции для покупателей</small></header>
<main><section class="intro"><h1>Замена клавиши ноутбука</h1><p>8 простых шагов: снятие и установка клавиши.<br>Листайте инструкцию в удобном темпе.</p></section>
<section class="panel" aria-label="Пошаговая инструкция"><div class="meta"><span id="count">Шаг 1 из 8</span><span class="section" id="section">Снятие клавиши</span></div><div class="progress" role="progressbar" aria-label="Прогресс инструкции" aria-valuemin="1" aria-valuemax="8" aria-valuenow="1" id="progress"><div id="bar"></div></div><img class="photo" id="photo" src="step-1.png" alt="Шаг 1 инструкции по замене клавиши" tabindex="0"><div class="hint">Нажмите на изображение, чтобы увеличить</div><div class="controls"><button class="prev" id="prev" disabled>← Назад</button><button class="next" id="next">Далее →</button></div><div class="dots" id="dots" aria-label="Выбор шага"></div></section>
<div class="foot">Если крепления отличаются от показанных на фото, не прикладывайте силу.<br><button class="reset" id="reset">Вернуться к первому шагу</button></div></main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Увеличенная фотография"><button class="close" id="close" aria-label="Закрыть">×</button><img id="zoom" alt="Увеличенное изображение шага"></div>
<script>
(()=>{'use strict';let step=1;const $=id=>document.getElementById(id),dots=$('dots');for(let i=1;i<=8;i++){let b=document.createElement('button');b.setAttribute('aria-label','Шаг '+i);b.addEventListener('click',()=>show(i));dots.appendChild(b)}function show(n){step=Math.max(1,Math.min(8,n));$('count').textContent='Шаг '+step+' из 8';$('section').textContent=step<=4?'Снятие клавиши':'Установка клавиши';$('photo').src='step-'+step+'.png';$('photo').alt='Шаг '+step+' инструкции по замене клавиши';$('bar').style.width=step*12.5+'%';$('progress').setAttribute('aria-valuenow',step);$('prev').disabled=step===1;$('next').textContent=step===8?'Готово ✓':'Далее →';dots.querySelectorAll('button').forEach((b,i)=>{if(i===step-1)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')})} $('prev').addEventListener('click',()=>show(step-1));$('next').addEventListener('click',()=>show(step===8?1:step+1));$('reset').addEventListener('click',()=>{show(1);window.scrollTo({top:0,behavior:'smooth'})});function open(){ $('zoom').src=$('photo').src;$('zoom').alt=$('photo').alt;$('overlay').classList.add('open');$('close').focus()}function close(){$('overlay').classList.remove('open');$('photo').focus()}$('photo').addEventListener('click',open);$('photo').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});$('close').addEventListener('click',close);$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('overlay').classList.contains('open'))close();else if(!$('overlay').classList.contains('open')&&e.key==='ArrowRight')show(step+1);else if(!$('overlay').classList.contains('open')&&e.key==='ArrowLeft')show(step-1)});show(1)})();
</script></body></html>
